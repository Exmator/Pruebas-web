<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Age Page</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Your Age</h1>
    <p th:text="'You are ' + ${years} + ' years old.'">You are 0 years old.</p>

    <div th::if="${years >= 18}">
        <p>You are an adult.</p>
    </div>
    <div th::if="${years < 18}">
        <p>You are a minor.</p>
    </div>
</body>
</html>
